; PHP-FPM log destinations for deployed environments.
;
; The official php:fpm base image ships /usr/local/etc/php-fpm.d/docker.conf,
; which deliberately points both logs at stderr so `docker logs` works:
;
;   [global] error_log  = /proc/self/fd/2
;   [www]    access.log = /proc/self/fd/2
;
; That is the right default for a container run interactively, but it means
; nothing is written to disk -- and the deployed stack collects PHP logs by
; tailing files. ho-ped/templates/userdata-app.sh.tpl configures the CloudWatch
; agent against /opt/app/logs/php/{access,error}.log, which is the host side of
; this container's /var/log/php mount. With the base image's defaults in place
; those files never exist, so the /ped/<env>/app/php-access and php-error log
; groups stayed empty from first deployment until this was found on 2026-08-14.
; The DMZ nginx tier already ships this way and worked throughout, which is
; what made the asymmetry visible.
;
; Filename starts zzz- so it loads after docker.conf, www.conf and
; zz-docker.conf; php-fpm reads php-fpm.d/*.conf in alphabetical order and the
; last assignment wins. error_log is a [global] setting and access.log is
; per-pool, hence both sections.
;
; Trade-off: `docker logs php-fpm` no longer shows request or error output.
; Read the files directly instead (tail -f /opt/app/logs/php/access.log on the
; host), or read them in CloudWatch -- which, unlike docker logs, survives the
; instance being replaced. Instances are replaced on any userdata change, so
; container-local logs were being destroyed routinely.
;
; /var/log/php is created and chowned to 10013:10013 by the drupal10
; Dockerfile. catch_workers_output = yes (www.conf) means worker stdout/stderr
; is folded into the error log and follows it here.

[global]
error_log = /var/log/php/error.log

[www]
access.log = /var/log/php/access.log

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/nginx/certs/444.crt;
    ssl_certificate_key /etc/nginx/certs/444.key;

    # Load-balancer health checks (e.g. AWS NLB) send the Host header of
    # the load balancer node itself, never $SITE, so they land here rather
    # than the real server block below. Everything else on this catch-all
    # still gets 444 unchanged. Proxies to PHP-FPM's own built-in /ping --
    # the same mechanism drupal10's own Docker HEALTHCHECK already uses,
    # confirmed live (returns "pong") -- so this proves the whole local
    # nginx+PHP-FPM chain is alive, not just nginx itself, with no
    # ped-drupal application code involved at all.
    location = /healthz {
        # ModSecurity was silently masking a completely dead PHP-FPM backend
        # behind a fake 200 here -- confirmed live: a genuine
        # "connect() failed (111: Connection refused)" to the fastcgi
        # upstream (logged in error.log) still produced a 200/14-byte
        # response to the client, defeating the entire point of this
        # health check (the NLB never saw the failure, so same-AZ
        # APP-only failures never triggered AZ failover). `off`, not just
        # removing rule 920350, since this location's only job is proving
        # the local nginx+PHP-FPM chain is alive -- WAF inspection of a
        # fixed, non-attacker-facing internal LB probe adds no security
        # value and was actively hiding backend failures. The real $SITE
        # server block below keeps the full ruleset; this only applies to
        # the health-check location.
        modsecurity off;
        # fastcgi_cache_valid (fastcgi.conf, loaded globally via nginx.conf's
        # `include /etc/nginx/conf.d/*.conf`) caches any 200 response for
        # 10 minutes, keyed on scheme+method+$host+uri. Each NLB
        # health-checker node sends its own source IP as the Host header
        # (a fixed value per node), so the FIRST successful check after
        # boot got cached for 10 minutes -- every check after that for the
        # next 10 minutes served that stale cached 200 with no backend
        # contact at all (confirmed live: upstream_status=- in the access
        # log, and reproduced on demand with
        # `curl -H "Host: <lb-node-ip>:443" https://localhost/healthz`),
        # regardless of whether PHP-FPM was actually alive. This, not
        # ModSecurity, was the real reason a dead paired APP instance never
        # flipped the NLB target unhealthy. `off` here disables both
        # reading and writing the cache for this location only.
        fastcgi_cache off;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $fpm_host $FPM_HOST;
        include fastcgi_params;
        fastcgi_pass $fpm_host;
        fastcgi_param SCRIPT_NAME /ping;
        fastcgi_param SCRIPT_FILENAME /ping;
    }

    location / {
        return 444;
    }
}

server {

    server_name $SITE;
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}

server {

    server_name $SITE;
    referer_hash_bucket_size 256;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    root $WEBROOT;

    ssl_certificate /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    include /etc/nginx/hardening.d/*.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_host $FPM_HOST;

    if ($env != 'PROD') {
      set $auth_basic "Restricted Content";
    }
    if ($env = 'PROD') {
      set $auth_basic off;
    }

    include /etc/nginx/conf.d/cache-server.conf.include;

    location / {
      satisfy any;
      include /etc/nginx/conf.d/ip-whitelist.conf.include;
      auth_basic $auth_basic;
      auth_basic_user_file /etc/nginx/.htpasswd;
      index index.php index.html index.htm;
      try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php(/|$) {
        satisfy any;
        include /etc/nginx/conf.d/ip-whitelist.conf.include;
        auth_basic $auth_basic;
        auth_basic_user_file /etc/nginx/.htpasswd;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $fpm_host;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_intercept_errors on;

        include /etc/nginx/conf.d/cache-location.conf.include;
    }

    location ^~ /.well-known/acme-challenge/ {
      auth_basic off;
    }

}

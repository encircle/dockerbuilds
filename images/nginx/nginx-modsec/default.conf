server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_certificate /etc/nginx/certs/444.crt;
    ssl_certificate_key /etc/nginx/certs/444.key;
    return 444;
}

server {

    server_name $SITE;
    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}

server {

    server_name $SITE;
    referer_hash_bucket_size 256;
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    root $WEBROOT;

    ssl_certificate /etc/nginx/certs/site.crt;
    ssl_certificate_key /etc/nginx/certs/site.key;

    include /etc/nginx/hardening.d/*.conf;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $fpm_host $FPM_HOST;

    if ($env != 'PROD') {
      set $auth_basic "Restricted Content";
    }
    if ($env = 'PROD') {
      set $auth_basic off;
    }

    include /etc/nginx/conf.d/cache-server.conf.include;

    location / {
      satisfy any;
      include /etc/nginx/conf.d/ip-whitelist.conf.include;
      auth_basic $auth_basic;
      auth_basic_user_file /etc/nginx/.htpasswd;
      index index.php index.html index.htm;
      try_files $uri $uri/ /index.php?$query_string;
    }
    
    location ~ \.php(/|$) {
        satisfy any;
        include /etc/nginx/conf.d/ip-whitelist.conf.include;
        auth_basic $auth_basic;
        auth_basic_user_file /etc/nginx/.htpasswd;

        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass $fpm_host;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_intercept_errors on;

        include /etc/nginx/conf.d/cache-location.conf.include;
    }

    location ^~ /.well-known/acme-challenge/ {
      auth_basic off;
    }

}
